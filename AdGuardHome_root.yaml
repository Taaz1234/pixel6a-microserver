bind_host: 0.0.0.0
bind_port: 3000
auth_name: ""
auth_pass: ""
language: es
theme: dark

dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  upstream_dns:
    - https://dns.cloudflare.com/dns-query
    - https://dns.quad9.net/dns-query
  bootstrap_dns:
    - 1.1.1.1
    - 9.9.9.9
  all_servers: false
  fastest_addr: true
  cache_size: 4194304
  cache_ttl_min: 300
  cache_ttl_max: 86400
  cache_optimistic: true
  blocked_response_ttl: 10
  protection_enabled: true
  blocking_mode: default
  ratelimit: 0

filtering:
  filtering_enabled: true
  parental_enabled: false
  safe_search:
    enabled: false
